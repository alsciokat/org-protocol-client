<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>org-protocol launcher</title>
		<!-- Loaded as a hidden iframe from the captured page so the
		     org-protocol:// navigation is initiated from the extension's own
		     (constant) origin. That makes Chrome's "always allow" choice for the
		     external-protocol dialog apply to every site at once. The redirect
		     lives in launch.js because MV3's extension-page CSP forbids inline
		     scripts. -->
		<script src="launch.js"></script>
	</head>
	<body></body>
</html>
